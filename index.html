<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>NECRO SWARM</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #0a0d14; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #text-layer { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  /* the engine's floating text, in the game's face */
  #text-layer .gm-float-text {
    font-family: inherit; font-weight: 700; font-size: 14px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 6;
    padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)); 
    display: flex; flex-direction: column; justify-content: space-between; }
  .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .hud-left { display: flex; align-items: center; gap: 6px; flex: none; }
  .pause-btn {
    pointer-events: auto; width: 34px; height: 34px; border-radius: 9px; flex: none; padding: 0;
    font: 700 11px/1 inherit; letter-spacing: -1px; color: #cfd4e4;
    background: rgba(20, 18, 38, 0.7); border: 1px solid #3a3a50; cursor: pointer;
  }
  .pause-btn:active { transform: scale(0.94); }
  #pause-sheet {
    position: fixed; inset: 0; z-index: 11;
    background: rgba(6, 8, 14, 0.9); backdrop-filter: blur(8px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 24px; text-align: center; pointer-events: auto;
  }
  #pause-sheet.hidden { display: none; }
  .pause-settings { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .small-btn.retreat { margin-top: 18px; color: #e0a0a0; border-color: #5a3040; }
  .small-btn.retreat.armed { color: #ffdddd; background: rgba(120, 30, 40, 0.9); border-color: #ff5555; }
  #hearts { white-space: nowrap; font-size: 20px; letter-spacing: 2px; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.7)); }
  .hud-center { text-align: center; white-space: nowrap; }
  #timer { font-size: 20px; font-weight: 700; color: #cfd4e4; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
  #timer.danger { color: #ff5555; }
  #wave { font-size: 10px; color: #7a8098; letter-spacing: 1px; }
  #night { font-size: 9px; color: #5a6078; letter-spacing: 1px; margin-top: 2px; }
  #orders {
    align-self: flex-start; margin-top: 6px; font-size: 10px; line-height: 1.6; color: #d8c890;
    white-space: pre-line; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  #orders.hidden { display: none; }

  .abilities { display: flex; gap: 10px; pointer-events: auto; }
  .ability {
    width: 54px; height: 54px; font-size: 24px; border-radius: 12px;
    border: 2px solid #6a4fc0; background: rgba(30, 25, 55, 0.85);
    position: relative; cursor: pointer; color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .ability.cooling { border-color: #3a3a50; opacity: 0.6; }
  .ability.locked { border-color: #3a3a50; opacity: 0.35; }
  .ability .cd {
    position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: #9aa; font-weight: 700;
  }
  .ability.cooling::after {
    content: ''; position: absolute; inset: 0; border-radius: 10px;
    background: rgba(0,0,0,0.55); height: var(--cd-pct, 0%);
    top: auto; bottom: 0; transition: height 0.1s linear;
  }

  #boss-bar {
    align-self: center; width: min(70vw, 320px); height: 16px;
    background: rgba(20,20,30,0.8); border: 1px solid #661111; border-radius: 8px;
    position: relative; overflow: hidden; display: none; margin-top: 4px;
  }
  #boss-bar.visible { display: block; }
  #boss-fill { height: 100%; background: linear-gradient(90deg, #cc2222, #ff5533); transition: width 0.15s; }
  #boss-bar span {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: #ffd0d0; letter-spacing: 2px; text-shadow: 0 1px 2px #000;
  }

  .hud-bottom { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; }
  #army { color: #69d16f; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  #kills { color: #d19a69; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(6, 8, 14, 0.93); backdrop-filter: blur(10px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center; pointer-events: auto;
  }
  #overlay.hidden { display: none; }
  .title {
    font-size: clamp(2rem, 10vw, 3.6rem); font-weight: 900; letter-spacing: 0.06em;
    color: #8f6fff; text-shadow: 0 0 34px rgba(140, 90, 255, 0.55);
  }
  .title.win { color: #69d16f; text-shadow: 0 0 34px rgba(80, 220, 100, 0.5); }
  .title.lose { color: #ff5555; text-shadow: 0 0 34px rgba(255, 60, 60, 0.5); }
  .sub { color: #8a90a8; font-size: 13px; }
  .stats { color: #aab; font-size: 14px; line-height: 2; }
  .big-btn {
    font-family: inherit; font-size: 18px; font-weight: 900; letter-spacing: 0.1em;
    color: #0a0d14; background: linear-gradient(135deg, #a880ff, #6a4fc0);
    border: none; border-radius: 10px; padding: 14px 44px; cursor: pointer;
    box-shadow: 0 0 26px rgba(140, 90, 255, 0.4);
  }
  .big-btn:active { transform: scale(0.96); }
  .small-btn {
    font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
    color: #8a90a8; background: rgba(30, 25, 55, 0.85);
    border: 1px solid #3a3a50; border-radius: 8px; padding: 8px 18px; cursor: pointer;
  }
  .small-btn:active { transform: scale(0.96); }
  .hint { color: #5a6078; font-size: 11px; line-height: 1.7; }
  .tiny-btn {
    font-family: inherit; font-size: 10px; color: #5a6078; background: none; border: none;
    text-decoration: underline; cursor: pointer; padding: 6px;
  }
  .chronicle { color: #cbb890; font-size: 13px; line-height: 1.6; max-width: 360px; font-style: italic; }
  .orders-end { color: #d8c890; }
  .souls-end { color: #b8a8e8; }

  /* ─── the map ─── */
  #map {
    position: fixed; inset: 0; z-index: 10; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #141a26 0%, #0a0d14 70%);
    display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    pointer-events: auto;
  }
  #map.hidden { display: none; }
  .map-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .map-title { font-size: 22px; font-weight: 900; letter-spacing: 0.08em; color: #8f6fff; text-shadow: 0 0 20px rgba(140,90,255,0.5); }
  #map-night { font-size: 10px; color: #7a8098; letter-spacing: 1px; margin-top: 2px; }
  .map-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #map-souls { font-size: 14px; font-weight: 700; color: #b8a8e8; }
  #map-chronicle { color: #cbb890; font-size: 13px; line-height: 1.5; font-style: italic; min-height: 2.6em; }
  #map-lieutenant { color: #ffd166; font-size: 11px; min-height: 1.4em; }
  #map-nodes { position: relative; flex: 1; min-height: 220px; }
  #map-roads { position: absolute; inset: 0; width: 100%; height: 100%; }
  #map-roads line { stroke: #3a3a50; stroke-width: 0.6; stroke-dasharray: 2 1.5; vector-effect: non-scaling-stroke; }
  .node {
    position: absolute; transform: translate(-50%, -50%); width: 96px;
    font-family: inherit; color: #cfd4e4; background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px;
  }
  .node-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #6a4fc0; background: #1e1937; box-shadow: 0 0 0 0 rgba(255,80,80,0); transition: box-shadow 0.3s; }
  .node-name { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-shadow: 0 1px 3px #000; }
  .node-sub { font-size: 9px; color: #7a8098; }
  .node.closed { opacity: 0.45; }
  .node.open .node-dot { border-color: #a880ff; box-shadow: 0 0 14px rgba(168,128,255,0.5); }
  .node.selected .node-dot { background: #6a4fc0; }
  .node.conquered .node-dot { background: #0a0d14; border-color: #3a3a50; }
  .node.conquered .node-name { color: #7a8098; }
  .node[data-fear="1"] .node-dot { box-shadow: 0 0 12px 4px rgba(255,120,80,0.25); }
  .node[data-fear="2"] .node-dot { box-shadow: 0 0 18px 8px rgba(255,100,60,0.35); }
  .node[data-fear="3"] .node-dot { box-shadow: 0 0 26px 12px rgba(255,80,40,0.5); border-color: #ff7755; }
  #node-card {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; transform: translateY(110%); transition: transform 0.2s;
    background: rgba(20, 17, 38, 0.97); border-top: 2px solid #6a4fc0; border-radius: 16px 16px 0 0;
    padding: 16px 18px max(18px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; align-items: stretch;
  }
  #node-card.visible { transform: translateY(0); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; }
  .card-head b { font-size: 18px; letter-spacing: 0.06em; color: #cbaaff; }
  .card-head span { font-size: 11px; color: #7a8098; }
  .card-line { font-size: 12px; color: #9aa0b8; line-height: 1.5; }
  .card-orders { color: #d8c890; }
  .bargain { font-size: 11px; color: #9aa0b8; display: flex; gap: 8px; align-items: center; }
  .bargain b { color: #ff9966; }
  #node-card .big-btn { align-self: center; margin-top: 4px; }
  #node-card .tiny-btn { align-self: center; }
  #reliquary {
    position: fixed; inset: 0; z-index: 13; background: rgba(6, 8, 14, 0.96);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; overflow-y: auto;
  }
  #reliquary.hidden { display: none; }
  #reliquary h2 { font-size: 20px; font-weight: 900; letter-spacing: 0.12em; color: #bb88ff; }
  .relics { display: flex; flex-direction: column; gap: 8px; width: min(90vw, 360px); }
  .relic {
    font-family: inherit; text-align: left; background: rgba(30, 25, 55, 0.92); border: 2px solid #6a4fc0; border-radius: 12px;
    padding: 10px 14px; cursor: pointer; color: #fff; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center;
  }
  .relic:disabled { opacity: 0.45; cursor: default; }
  .relic.owned { border-color: #69d16f; opacity: 0.7; }
  .relic b { font-size: 13px; letter-spacing: 0.06em; color: #cbaaff; }
  .relic span { grid-column: 1; font-size: 11px; color: #9aa0b8; line-height: 1.4; }
  .relic em { grid-column: 2; grid-row: 1 / span 2; font-style: normal; font-size: 12px; font-weight: 700; color: #b8a8e8; }

  #gift-sheet {
    position: fixed; inset: 0; z-index: 9;
    background: rgba(6, 8, 14, 0.82); backdrop-filter: blur(6px);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; pointer-events: auto;
  }
  #gift-sheet.visible { display: flex; }
  #gift-sheet h2 {
    font-size: 20px; font-weight: 900; letter-spacing: 0.12em;
    color: #bb88ff; text-shadow: 0 0 22px rgba(140, 90, 255, 0.5);
  }
  .gift-card {
    font-family: inherit; width: min(86vw, 340px); text-align: left;
    background: rgba(30, 25, 55, 0.92); border: 2px solid #6a4fc0; border-radius: 12px;
    padding: 14px 16px; cursor: pointer; color: #fff;
  }
  .gift-card:active { transform: scale(0.97); }
  .gift-card b { display: block; font-size: 14px; letter-spacing: 0.08em; color: #cbaaff; margin-bottom: 4px; }
  .gift-card span { font-size: 12px; color: #9aa0b8; line-height: 1.5; }
